server:
  port: 8081

spring:
  main:
    web-application-type: servlet

  application:
    name: ms-wallet

  datasource:
    url: jdbc:postgresql://localhost:5432/ms-wallets
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

client:
  url: http://localhost:8080/api/v1/clients
